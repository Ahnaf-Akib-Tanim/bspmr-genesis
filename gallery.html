(function () {
  var B = BSPMR, D = B.data;
  var G = B.GALLERY, cls = ['w2 h2', '', '', 'w2', 'w2', 'w2', 'w2', 'w2'];
  var gal = document.getElementById('gal');
  gal.innerHTML = G.map(function (g, i) { return '<a href="' + g.src + '" class="' + (cls[i] || '') + '" data-i="' + i + '" data-cap="' + B.esc(g.cap) + '"><img src="' + g.src + '" alt="' + B.esc(g.cap) + '" loading="lazy"></a>'; }).join('');
  gal.addEventListener('click', function (e) { var a = e.target.closest('a'); if (!a) return; e.preventDefault(); B.lightbox(G, +a.dataset.i); });

  B.reveal();
})();
